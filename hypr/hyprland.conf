# ───────────── CYBERDOTS · hyprland.conf ─────────────
# Palette : bg #0a0710 · cyan #00e5ff · magenta #ff2bd6 · jaune #fcee0a

monitor = , preferred, auto, 1

$mod  = SUPER
$term = kitty
$menu = rofi -show drun

exec-once = waybar
exec-once = swaync
exec-once = swaybg -i ~/.config/hypr/wallpaper.jpg -m fill
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = systemctl --user start hyprpolkitagent

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland

input {
    kb_layout = fr
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border   = rgba(ff2bd6ff) rgba(00e5ffff) 45deg
    col.inactive_border = rgba(2a1a3dff)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.92
    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0.02
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(ff2bd655)
    }
}

animations {
    enabled = true
    bezier = snap, 0.2, 0.9, 0.1, 1.0
    animation = windows,    1, 5, snap, popin 85%
    animation = fade,       1, 5, snap
    animation = workspaces, 1, 5, snap, slide
    animation = border,     1, 10, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x0a0710
}

# ───────────── Keybinds ─────────────
bind = $mod, Return, exec, $term
bind = $mod, D, exec, $menu
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, L, exec, hyprlock
bind = $mod, N, exec, swaync-client -t -sw
bind = $mod SHIFT, E, exit
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Workspaces (codes de touches : marche en AZERTY et QWERTY)
bind = $mod, code:10, workspace, 1
bind = $mod SHIFT, code:10, movetoworkspace, 1
bind = $mod, code:11, workspace, 2
bind = $mod SHIFT, code:11, movetoworkspace, 2
bind = $mod, code:12, workspace, 3
bind = $mod SHIFT, code:12, movetoworkspace, 3
bind = $mod, code:13, workspace, 4
bind = $mod SHIFT, code:13, movetoworkspace, 4
bind = $mod, code:14, workspace, 5
bind = $mod SHIFT, code:14, movetoworkspace, 5
bind = $mod, code:15, workspace, 6
bind = $mod SHIFT, code:15, movetoworkspace, 6
bind = $mod, code:16, workspace, 7
bind = $mod SHIFT, code:16, movetoworkspace, 7
bind = $mod, code:17, workspace, 8
bind = $mod SHIFT, code:17, movetoworkspace, 8
bind = $mod, code:18, workspace, 9
bind = $mod SHIFT, code:18, movetoworkspace, 9

# Médias
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.2 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
