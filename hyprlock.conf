background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    blur_passes = 2
    blur_size = 4
    brightness = 0.7
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(ff2bd6) rgb(00e5ff) 45deg
    inner_color = rgba(100818cc)
    font_color = rgb(d5f6f7)
    fade_on_empty = true
    placeholder_text = <i>// access_</i>
    fail_color = rgb(ff3c5f)
    rounding = 8
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(00e5ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A %d %B')"
    color = rgb(ff2bd6)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
